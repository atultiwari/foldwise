[project]
name = "foldwise-pipeline"
version = "0.1.0"
description = "Offline ETL: RCSB mmCIF -> validated, compact structure JSON for the Foldwise viewer"
requires-python = ">=3.10"
dependencies = [
    "gemmi>=0.6.6",
    "numpy>=2.2.6",
    "pydantic>=2.9",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "freesasa>=2.2.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foldwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: needs the structure cache and the PDBe API"]
